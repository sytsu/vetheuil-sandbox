name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: vt validate
        run: python3 tools/vt_validate.py

  ios:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Stamp build info
        run: |
          XC="$(xcodebuild -version | head -1)"
          cat > Sandbox/BuildInfo.swift <<EOF
          // Generated by CI.
          enum BuildInfo {
              static let commit = "${GITHUB_SHA::7}"
              static let date = "$(date -u +%Y-%m-%d\ %H:%MZ)"
              static let toolchain = "$XC"
          }
          EOF

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -project Sandbox.xcodeproj -scheme Sandbox -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          digest() {
            grep -E '(error|warning): ' build.log | sed "s|$PWD/||" | sort -u | head -60
            grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' build.log | tail -1
          }
          { echo "### xcodebuild exit $status"; echo '```'; digest; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          digest
          [ $status -ne 0 ] && tail -40 build.log
          exit $status

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Sandbox.app
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry ../Vetheuil-Sandbox.ipa Payload)
          ls -la Vetheuil-Sandbox.ipa
          ls "$APP"
          plutil -p "$APP/Info.plist"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ github.sha }}
          path: |
            build.log
            Vetheuil-Sandbox.ipa
          if-no-files-found: ignore

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rolling --yes --cleanup-tag || true
          gh release create rolling Vetheuil-Sandbox.ipa \
            --prerelease --target "$GITHUB_SHA" \
            --title "Sandbox ${GITHUB_SHA::7}" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Sign and install with SideStore or similar."
