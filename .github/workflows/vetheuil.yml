# Generated by `vt init-ci` (Vétheuil 0.1.0, vt pinned to 58fd1016617dcad6244d99defa8b09ac9b6ddf73). Safe to edit.
name: vetheuil

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vetheuil-${{ github.ref }}
  cancel-in-progress: true

env:
  VT_URL: https://raw.githubusercontent.com/sytsu/vetheuil/58fd1016617dcad6244d99defa8b09ac9b6ddf73/vt.py
  KIND: project
  CONTAINER: "Sandbox.xcodeproj"
  SCHEME: "Sandbox"
  CONFIGURATION: Release

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: curl -fsSL "$VT_URL" -o /tmp/vt.py && python3 /tmp/vt.py validate "Sandbox.xcodeproj"

  ios:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Toolchain
        run: |
          xcodebuild -version
          curl -fsSL "$VT_URL" -o /tmp/vt.py
      - name: Stamp build info
        run: |
          XC="$(xcodebuild -version | head -1)"
          cat > Sandbox/BuildInfo.swift <<EOF
          // Generated by CI.
          enum BuildInfo {
              static let commit = "${GITHUB_SHA::7}"
              static let date = "$(date -u +%Y-%m-%d\ %H:%MZ)"
              static let toolchain = "$XC"
          }
          EOF
      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild "-$KIND" "$CONTAINER" -scheme "$SCHEME" -configuration "$CONFIGURATION" \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          python3 /tmp/vt.py digest build.log --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 /tmp/vt.py digest build.log
          exit $status
      - name: Package IPA
        run: |
          APP="$(find "build/Build/Products/$CONFIGURATION-iphoneos" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "no .app built"; exit 1; }
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry "../Vetheuil-Sandbox.ipa" Payload)
          ls -la "Vetheuil-Sandbox.ipa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ github.sha }}
          path: |
            build.log
            *.ipa
          if-no-files-found: ignore
      - name: Publish rolling release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rolling --yes --cleanup-tag || true
          gh release create rolling "Vetheuil-Sandbox.ipa" --prerelease --target "$GITHUB_SHA" \
            --title "$SCHEME ${GITHUB_SHA::7}" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Sign and install with SideStore or similar."
